name: Daily Stock Picks

on:
  schedule:
    # Runs at 21:30 UTC on weekdays (covers ~4:30pm ET regardless of
    # daylight saving, so it's safely after the 4pm market close).
    - cron: '30 21 * * 1-5'
  workflow_dispatch:  # lets you also trigger it manually from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit the updated CSV back

jobs:
  run-picks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily stock picks script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python daily_stock_challenge.py

      - name: Commit and push updated log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_challenge_log.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Update stock picks log $(date +'%Y-%m-%d')"
          git push
